html<br><!DOCTYPE html><br><html><br><head><title>Budget Login</title></head><br><body><br> <h2>Budget Dashboard</h2><br> <input type="password" id="pass" placeholder="Password"><br> <button onclick="login()">Login</button><br> <script><br> async function login() {<br> const res = await fetch('http://localhost:5000/api/login', {<br> method: 'POST',<br> headers: {'Content-Type':'application/json'},<br> body: JSON.stringify({password: document.getElementById('pass').value})<br> });<br> if(res.ok) alert('Success');<br> else alert('Wrong password');<br> }<br> </script><br></body><br></html><br>
